<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Inpatient Corridors: The Yellow Door — interactive alpha">
<title>The Yellow Door — Inpatient Corridors</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">
<header>
<p class="eyebrow">INPATIENT CORRIDORS · ALPHA</p>
<h1>The Yellow Door</h1>
<p class="intro">A 15–20 minute interactive narrative about uncertainty, participation, support, and process.</p>
</header>
<section id="game" aria-live="polite">
<div id="story"></div>
<div id="choices" aria-label="Story choices"></div>
<div id="error" role="alert">Starting the Yellow Door…</div>
</section>
<footer>
<a href="../../">Back to project</a>
<span id="stats" hidden></span>
</footer>
</main>
<script>
window.addEventListener("error", (event) => {
  const el = document.getElementById("error");
  if (!el) return;
  el.hidden = false;
  el.textContent = `Runtime error: ${event.message || "The Yellow Door runtime could not load."}`;
});

window.addEventListener("unhandledrejection", (event) => {
  const el = document.getElementById("error");
  if (!el) return;
  el.hidden = false;
  const reason = event.reason;
  el.textContent = `Runtime error: ${reason?.message || reason || "The Yellow Door runtime failed to start."}`;
});
</script>
<script src="vendor/ink.js?v=20260923-4"></script>
<script src="app.js?v=20260923-4"></script>
</body>
</html>
