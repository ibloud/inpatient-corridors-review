name: Build Yellow Door

on:
  push:
    branches: [main]
    paths:
      - "interactive/yellow-door/story/yellow-door-alpha.ink"
      - "interactive/yellow-door/docs/**"
      - ".github/workflows/build-yellow-door.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Ink compiler
        run: npm install --no-save --ignore-scripts inkjs@2.4.0
      - name: Compile Ink to JSON
        run: |
          npx --no-install inkjs -s interactive/yellow-door/story/yellow-door-alpha.ink > /tmp/ink-stats.json
          npx --no-install inkjs -o interactive/yellow-door/story/yellow-door-alpha.json interactive/yellow-door/story/yellow-door-alpha.ink
      - name: Verify compiled story
        run: |
          test -s interactive/yellow-door/story/yellow-door-alpha.json
          node -e "const fs=require('fs'); const raw=fs.readFileSync('interactive/yellow-door/story/yellow-door-alpha.json','utf8').replace(/^\\uFEFF/,''); JSON.parse(raw); console.log('Compiled JSON is valid.')"
      - name: Commit compiled story
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive/yellow-door/story/yellow-door-alpha.json
          git diff --cached --quiet || git commit -m "Build Yellow Door Ink story"
          git push
