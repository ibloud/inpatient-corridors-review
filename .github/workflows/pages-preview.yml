name: GitHub Pages preview

on:
  push:
    branches:
      - redesign/resources-front-door
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live site
        uses: actions/checkout@v4
        with:
          ref: main
          path: live

      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: redesign/resources-front-door
          path: preview-source

      - name: Assemble Pages site
        run: |
          mkdir -p site/preview
          cp -R live/. site/
          cp -R preview-source/. site/preview/
          rm -rf site/preview/.git
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
