name: Build Rabbit Hole browser bundle
on:
  push:
    paths:
      - "rabbit-hole/**"
      - ".github/workflows/rabbit-hole.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p rabbit-hole/.build
      - run: printf '%s\n' '{"name":"ink-build","private":true,"version":"0.0.0"}' > package.json
        working-directory: rabbit-hole/.build
      - run: npm install --no-save inkjs@2.4.0
        working-directory: rabbit-hole/.build
      - run: node rabbit-hole/.build/node_modules/inkjs/bin/inkjs-compiler.js rabbit-hole/story.ink -o rabbit-hole/story.json
      - run: cp rabbit-hole/.build/node_modules/inkjs/dist/ink-full.js rabbit-hole/vendor/ink-full.js
      - run: |
          node - <<'NODE'
          const fs=require('fs');
          const ink=require('./rabbit-hole/.build/node_modules/inkjs/dist/ink-full.js');
          const src=fs.readFileSync('rabbit-hole/story.ink','utf8');
          const story=new ink.Compiler(src).Compile();
          let n=0;
          while(story.canContinue && n<200){story.Continue();n++}
          if(n===0) process.exit(2);
          console.log('Ink compile/runtime smoke test passed:', n, 'continues');
          NODE
      - run: rm -rf rabbit-hole/.build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rabbit-hole/story.json rabbit-hole/vendor/ink-full.js
          git diff --cached --quiet || git commit -m "Build vendored Ink runtime and compiled story"
          git push
