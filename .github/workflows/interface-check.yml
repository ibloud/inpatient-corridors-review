name: Check project interface
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/build-docs.cjs --check
